- id: ai
  title: AI · 从任务与对照找证据
  method_url: /knowledge/reading-ai-evidence/
  method_label: 读 AI 评测证据
  questions:
    - 作者实际测了什么任务、数据和评价指标？结论的适用范围在哪里？
    - 与谁比较？基线、模型版本、工具、推理预算和评测条件是否可比？
    - 证据是作者自报、第三方复现还是独立评测？有哪些失败案例与尚未验证的外推？
  outline: |
    【研读提纲｜AI 证据】
    原文主张：
    任务、数据与指标：
    基线、模型版本与预算：
    证据位置与独立性：
    适用边界／失败案例：
    我的解释：
    下一步核对：
- id: economy
  title: 经济 · 把时间、口径与机制放回来
  method_url: /knowledge/reading-world-evidence/
  method_label: 读政经材料的方法
  questions:
    - 这是已公布的实绩、估计还是预测？发布日期、数据截止日和统计期分别是什么？
    - 名义与实际、总量与人均、同比与环比、季调与未季调是否可比？是否有修订？
    - 作者提出了什么机制或情景假设？相关变化还可能有哪些替代解释？
  outline: |
    【研读提纲｜经济口径】
    原文主张／指标：
    实绩、估计或预测：
    发布日、统计期与版本：
    单位、价格口径与比较基准：
    证据位置、机制与替代解释：
    我的解释：
    下一步核对：
- id: politics
  title: 政治 · 分清文本、立场与实施
  method_url: /knowledge/reading-world-evidence/
  method_label: 读政经材料的方法
  questions:
    - 谁在何时说了什么？这是原始文本、转述、机构立场还是作者解释？
    - 若涉及法律或政策，处于草案、通过、公布、施行中的哪一步？适用对象和日期是什么？
    - 有没有可定位的条文与独立来源？多家报道是否只是在转引同一份材料？
  outline: |
    【研读提纲｜政治文本】
    原文主张／发布者：
    文本版本、日期与状态：
    条文、具名来源或证据位置：
    机构立场与独立证据：
    适用范围／尚不确定的部分：
    我的解释：
    下一步核对：

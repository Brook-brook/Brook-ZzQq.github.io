entries:
  - title: Agent 循环 · 提议、执行与停止
    kind: lab
    url: /playground/agent-runtime/
    summary: 固定脚本逐步提议，实际执行只读GIS工具，核对批量调用、模拟故障、旧回执、预算和停止；不调用模型。
    keywords: [Agent, 智能体, agent loop, runtime, 工具调用, 预算, 停止, 回执, trace, Python]
  - title: AI 与 Agent 开发学习路径
    kind: page
    url: /study/ai/
    summary: 从模型、上下文和请求契约出发，学习工具、Agent循环、RAG证据与任务评测；两条开放路线连接笔记、实验和自解释。
    keywords: [AI 开发, AI开发, Agent 开发, Agent开发, 智能体开发, 人工智能, LLM, 大语言模型, RAG, 检索增强生成, API, context, workflow, curriculum, 学习路径, 基础知识]
    featured: true
  - title: 公共物品 · 个人激励与共同收益
    kind: lab
    url: /playground/public-goods/
    summary: 调整人数、放大倍率与每人贡献，逐人核对最佳回应、纯策略均衡、总收益和等号边界。
    keywords: [公共物品, public goods, MPCR, 合作, Nash, 纳什, 博弈论, 总收益, 最佳回应]
  - title: GIS Tool Calling · 提议、执行与回执
    kind: lab
    url: /playground/tool-calling/
    summary: 修改结构化参数，逐步执行三个本机只读 GIS 工具，拦住类型错误、未开放工具与错配回执。
    keywords: [AI, Agent, MCP, Tool Calling, function calling, 工具调用, 参数, JSON, GIS, 权限, 回执]
  - title: 自解释练习 · 一次讲清一个问题
    kind: page
    url: /study/practice/
    summary: 按路线或本机手记选题，先解释，再核对提示、参考思路和反例；与学习路线共用同一份本机记录。
    keywords: [学习, 练习, 复习, 自解释, practice, retrieval, AI, 政经, 反例]
    featured: true
  - title: GIS × AI · 空间留出与邻居证据
    kind: lab
    url: /playground/spatial-validation/
    summary: 在 80 个合成点上运行真实 kNN，对照随机与整区留出，核对距离、类别和逐点预测。
    keywords: [GIS, AI, spatial validation, kNN, 空间验证, 随机划分, 测试集, 邻居, 欧氏距离]
  - title: AI 评测 · 阈值与错误
    kind: lab
    url: /playground/evaluation/
    summary: 调整合成分数阈值，逐条核对混淆矩阵、准确率、精确率、召回率与 F1。
    keywords: [AI, 人工智能, evaluation, classification, precision, recall, F1, accuracy, 评测, 混淆矩阵, 阈值, 误报, 漏报]
  - title: 学习路线与手记
    kind: page
    url: /study/paths/
    summary: 从真实笔记、可运行实验和自查问题开始，按自己的节奏留下解释。
    keywords: [学习, 路线, journal, 自查]
    featured: true
  - title: Study · 笔记与研究
    kind: page
    url: /study/
    summary: 按类型、分类与关键词查找公开教程和有来源的项目研究。
    keywords: [教程, 研究, 源码, 学习笔记]
    featured: true
  - title: Brook’s Digital Universe
    kind: page
    url: /
    summary: 学习笔记、作品、实验与不断生长的新方向。
    keywords: [首页, home, Brook]
  - title: Projects · 作品与实验记录
    kind: page
    url: /projects/
    summary: 查看真实实现、待发布作品与未来计划，阅读实现边界。
    keywords: [项目, 作品, 实现, portfolio]
  - title: 紫金港校园探索
    kind: page
    url: /explore/
    summary: 六个有公开来源的地点代表点，支持搜索、收藏与图层；不是道路导航。
    keywords: [GIS, campus, 地图, 坐标, WGS84, 紫金港]
    featured: true
  - title: 知识关系图
    kind: page
    url: /knowledge/
    summary: 按明确理由查看笔记的准备、延伸与对照联系，连接真实实验与自解释，保留完整公开目录。
    keywords: [知识地图, concepts, connections, 关系, 阅读联系, 下一篇]
  - title: Playground · 交互实验
    kind: page
    url: /playground/
    summary: 通过收益矩阵、对象复制、投影尺度与代码实验检验自己的解释。
    keywords: [实验, code, 动手]
  - title: AI 前沿与全球观察
    kind: page
    url: /observatory/
    summary: 有来源的公开元信息、选编导读与本机专注研读；动态更新请在观察台查询。
    keywords: [AI, 经济, 政治, 新闻, 来源, RSS, 研读]
  - title: About Brook
    kind: page
    url: /about/
    summary: 关于这个个人数字空间与公开身份 Brook。
    keywords: [关于, 个人空间]
  - title: Python 代码实验
    kind: lab
    url: /playground/python/
    summary: 修改变量、判断、循环、函数与容器示例，在浏览器 Worker 中执行 Python。
    keywords: [Python, loops, functions, 列表, 字典, 代码]
    featured: true
  - title: 囚徒困境与猎鹿博弈
    kind: lab
    url: /playground/#game
    summary: 调整策略与收益矩阵，区分最佳回应、纯策略均衡和集体利益。
    keywords: [game theory, 合作, 背叛, 博弈论]
  - title: C++ 对象复制与所有权
    kind: lab
    url: /playground/#copy
    summary: 逐步观察浅拷贝、深拷贝与资源释放；不把未定义行为当成固定结果。
    keywords: [C++, deep copy, shallow copy, RAII, 内存, 析构]
  - title: 墨卡托投影尺度
    kind: lab
    url: /playground/#geo
    summary: 调整纬度，比较局部长度和面积尺度及其适用范围。
    keywords: [Mercator, GIS, 投影, 空间, 地图]
  - title: 纳什均衡探索器
    kind: lab
    url: /playground/nash/
    summary: 编辑 2×2 收益矩阵，寻找能抵抗单方面偏离的纯策略结果；不计算混合策略。
    keywords: [Nash, 最佳回应, 博弈, 矩阵]
  - title: RSS Research Workbench · 数据去重实验
    kind: lab
    url: /playground/research/
    summary: 修改本地 RSS／Atom，查看 URL 规范化、去重原因和待核对 JSON，不抓取外网。
    keywords: [RSS, Atom, URL, normalization, 去重, 数据]

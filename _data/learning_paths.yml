- id: python-data
  challenge: 用自编数据写一个最小 Python 清洗脚本，保留正常与错误输入的例子，不必先接入 AI。
  title: 从 Python 到可核对的数据
  summary: 从一个能运行的函数出发，整理数据，再追踪研究结论的来源。
  prerequisite: 可以从零开始；先读教程，再打开实验。
  steps:
    - id: python-values
      title: 把输入变成可解释的输出
      note: python-first-steps
      lab: /playground/python/
      lab_label: 运行 Python
      question: 把列表改为空列表，mean 函数会发生什么？记录一次正常输出与一次异常，并解释原因。
    - id: rss-records
      title: 为数据定义相等与重复
      note: rss-normalization
      lab: /playground/research/
      lab_label: 修改 RSS 样本
      question: 只改变 id 参数，再改变 utm_source，分别观察保留条数。URL 相同能否证明正文相同？
    - id: source-evidence
      title: 让研究判断有可追溯的证据
      note: bestblogs-research
      question: 从原始源码找一条 A 级证据，再写一条不能确认的 D 级问题。来源已核对为什么不等于结论已获人工批准？
- id: spatial-reasoning
  challenge: 为一份获准使用的公开空间数据写一张说明卡：来源、CRS、单位、分辨率与不能支持的结论。
  title: 在空间分析前，先问清模型
  summary: 从投影尺度走向真实地点资料，区分计算结果、示意与数据限制。
  prerequisite: 了解经纬度即可；公式可结合实验反复观察。
  steps:
    - id: mercator-assumptions
      title: 分清长度、面积与局部尺度
      note: mercator-scale
      lab: /playground/#geo
      lab_label: 调整纬度
      question: 纬度 60° 时，长度尺度和面积尺度分别是多少？为什么不能用单点尺度修正任意长路线？
    - id: map-provenance
      title: 检查地图能支持什么结论
      note: mercator-scale
      lab: /explore/
      lab_label: 检查校园地点与来源
      question: 选一个地点查看来源。代表点与建筑入口有何区别？现有地点图是否足够支持步行最短路径？
- id: cpp-ownership
  challenge: 用值类型或 std::vector 写一个可独立复制的小例子，再用自己的话解释资源何时释放。
  title: 看见对象背后的资源
  summary: 比较复制与析构，练习在看起来正常的代码中辨认所有权边界。
  prerequisite: 知道变量和函数的基本含义；不需要先掌握全部 C++。
  steps:
    - id: copy-relations
      title: 对象复制了，资源也复制了吗？
      note: cpp-copy
      lab: /playground/#copy
      lab_label: 逐步观察对象复制
      question: 浅拷贝时两个对象指向哪里？深拷贝后修改副本，原对象为什么保持独立？
    - id: lifetime-boundaries
      title: 不把未定义行为当作固定结果
      note: cpp-copy
      lab: /playground/#copy
      lab_label: 比较析构与 RAII 示例
      question: 一份资源由两个原始指针重复释放时，能否预测确定输出？std::vector 示例如何表达独立值语义？
- id: game-models
  challenge: 设计一个自己的 2×2 收益矩阵，逐一说明哪些结果能抵抗单方面改变策略。
  title: 把策略和最优分开看
  summary: 从个人收益到收益矩阵，辨认均衡、共同利益和模型的计算范围。
  prerequisite: 能比较两个数的大小；先从 2×2 矩阵开始。
  steps:
    - id: individual-collective
      title: 个人最佳回应与集体利益
      note: game-equilibrium
      lab: /playground/#game
      lab_label: 调整博弈策略
      question: 囚徒困境中的均衡为什么不是集体收益最高的结果？猎鹿博弈为什么会有两个纯策略均衡？
    - id: pure-equilibrium
      title: 没找到纯策略均衡，意味着什么？
      note: game-equilibrium
      lab: /playground/nash/
      lab_label: 编辑收益矩阵
      question: 用匹配硬币的收益矩阵测试探索器。没有纯策略均衡，是否等于不存在任何纳什均衡？
- id: ai-spatial-evidence
  challenge: 为一个空间分类问题写下部署区域、划分依据、错误成本和保留的独立测试，再用一个样本追踪预测证据。
  title: 从 AI 指标到空间验证
  summary: 核对指标的分母，改变留出区域，沿训练邻居回到可以检查的证据。
  prerequisite: 知道点坐标和二分类；公式可结合实验阅读。
  steps:
    - id: classification-denominators
      title: 90% 准确率回答了什么？
      note: ai-evaluation-basics
      lab: /playground/evaluation/
      lab_label: 调整阈值与类别
      question: 稀有正例场景把阈值调到 100，再换成没有正例。两个场景的召回率为什么分别为 0 和未定义？
    - id: spatial-holdout
      title: 从已采样区域，走向新的区域
      note: spatial-validation
      lab: /playground/spatial-validation/
      lab_label: 对照两种留出
      question: 同一组点换成对角线标签，整区留出的表现一定更差吗？选一个测试点，核对训练邻居、类别比例和预测目标。
    - id: evaluation-evidence
      title: 把模型成绩放回使用场景
      note: reading-ai-evidence
      question: 阅读一份模型报告，找出任务、部署分布、划分、基线和不确定性。缺少空间外推测试时，哪些结论仍不能确认？
- id: frontier-reading
  challenge: 从观察台挑一份 AI 或政经材料，附版本与原文位置，分开写作者主张、证据、自己的解释和能改变判断的新证据。
  title: 让前沿信息，变成自己的理解
  summary: 用任务条件、统计口径与政策状态，练习阅读 AI 和全球政经资料；不把新标题当作已核对结论。
  prerequisite: 选择一份可回查的公开材料；可以从阅读提纲开始，不要求先懂全部背景。
  steps:
    - id: ai-version-scope
      title: 给 AI 能力声明补上版本和条件
      note: reading-ai-evidence
      lab: /observatory/#reading-guides
      lab_label: 查看 AI 阅读提纲
      question: 一篇预印本、一段产品演示和一次独立评测，分别能支持什么？写出任务、版本、基线与预算，保留还不能确认的部分。
    - id: economy-denominators
      title: 数字相似，比较的是同一件事吗？
      note: reading-world-evidence
      lab: /observatory/#reading-guides
      lab_label: 查看经济阅读提纲
      question: 从一份经济材料找出统计期、单位、同比或环比、名义或实际，以及实绩/估计/预测。哪些条件缺失时不能直接比较？
    - id: policy-status
      title: 一项政策，从主张走到结果
      note: reading-world-evidence
      lab: /observatory/#reading-guides
      lab_label: 查看政治阅读提纲
      question: 选一个可回查的文本，区分草案、通过、适用与执行结果；两家报道引用同一文件，是否已经形成两份独立证据？
- id: tool-evidence
  challenge: 给一个只读工具写出输入契约、允许操作、回执检查和不能支持的结论；把参数错误、执行错误与解释越界分开记录。
  title: 从调用提议，到能核对的结果
  summary: 实际执行本机 GIS 工具，沿参数、权限、回执与资料边界认识 Tool Calling；不把脚本当作真实模型。
  prerequisite: 能阅读简单 JSON；不需要模型账号或 API Key。
  steps:
    - id: tool-contract
      title: JSON 合法，就可以执行了吗？
      note: tool-calling-boundaries
      lab: /playground/tool-calling/
      lab_label: 修改参数与开放工具
      question: 把 radius_m 的字符串改成数值，再尝试未开放工具。语法合法、符合参数契约、权限允许和符合用户意图，为什么不是同一件事？
    - id: tool-observation
      title: 这份结果，属于哪一次调用？
      note: tool-calling-boundaries
      lab: /playground/tool-calling/
      lab_label: 检查错配回执
      question: 操作回执错误案例，修改参数后观察旧结果。调用 ID 对应、本机重算一致，分别能证明什么，又不能证明什么？
    - id: tool-boundaries
      title: 算出了距离，就能导航了吗？
      note: tool-calling-boundaries
      lab: /playground/tool-calling/
      lab_label: 对照距离与目录范围
      question: 查询半径 0 的结果，或查未收录的食堂。为什么空结果不是现实不存在？球面距离、WGS84 坐标和步行路线有哪些不同？
- id: cooperation-incentives
  challenge: 设计一组贡献，逐人说明谁能单方面多得，再另算总收益；记录条件，避免把同一个模型直接当作现实政策结论。
  title: 分开看个人激励与共同收益
  summary: 调整公共物品的贡献和倍率，核对单方面偏离、总收益目标和两种不同的无差别边界。
  prerequisite: 能比较数值和读简单收益公式；不要求先懂全部博弈论。
  steps:
    - id: public-goods-incentives
      title: 独自少投，与大家一起少投
      note: public-goods
      lab: /playground/public-goods/
      lab_label: 调整贡献与逐人最佳回应
      question: 默认四人各投10，先只让玩家1改投0，再让所有人都投0。为什么第一次玩家1得32，第二次却只有20？均衡和总收益目标分别比较了什么？
    - id: public-goods-boundaries
      title: 哪一种无差别，属于哪一个目标？
      note: public-goods
      lab: /playground/public-goods/
      lab_label: 比较倍率等号与收益切片
      question: 依次把倍率设成1、设成人数，解释为什么“所有组合总收益相同”和“所有纯策略组合都是均衡”不是同一件事。为什么两人端点切片不能代替全体逐人检查？
- id: ai-development
  challenge: 为一个获准使用的任务写最小应用卡：输入/输出、简单基线、失败例、模型和工具各自职责、预算、证据及保留测试；不需要先开通付费API。
  title: 从一个请求，开始 AI 开发
  summary: 先明确任务和上下文，再练请求、结构化输出与评测，分清能运行、符合格式和真正做对。
  prerequisite: 能读一个 Python 函数和简单 JSON 即可；可先用已有本地实验，不需要 API Key。
  steps:
    - id: ai-model-boundaries
      title: 模型、程序和数据各做什么？
      focus: 从一个具体任务拆分职责，分清上下文、会话存储与参数更新。
      note: ai-app-foundations
      question: 为“计算两个目录点的距离并解释限制”分配模型、程序和资料的职责。把模型拿掉，哪些部分仍应正确？把资料放进上下文为什么不等于更新模型参数？
    - id: ai-request-failures
      title: 完成、拒绝和不完整，怎样分开？
      focus: 看懂一次请求的状态、错误、重试与超时；附可在本地运行的 Python 例子。
      note: model-request-contracts
      question: 对完整文本、拒绝、不完整、429和超时各写一个应用状态。为什么流式中断后重试不能直接拼接正文？15秒传输超时是否等于全任务15秒截止？
    - id: ai-output-contract
      title: Schema 正确，结果就正确吗？
      focus: 接着读同篇的输出契约，用实际工具检查格式、权限和事实证据的差别。
      note: model-request-contracts
      lab: /playground/tool-calling/
      lab_label: 实测 JSON 类型与开放工具边界
      question: 在工具实验中修改数值/字符串，再检查一个合法但与原意不符的参数。分别说明语法、schema、权限和事实证据能保证什么，不能保证什么。
    - id: ai-task-evaluation
      title: 用什么证明这次改动有用？
      focus: 先写一个简单基线、三个失败例和保留测试，再决定怎样评价改动。
      note: agent-evaluation
      lab: /playground/evaluation/
      lab_label: 用合成分类实验复习指标分母
      question: 为自己的 AI 小任务写一个简单基线和三种失败用例，保留未调过的测试。为什么这个合成分类实验的分数不能当作自己 Agent 的成绩？
- id: agent-development
  challenge: 画出一个只读 Agent 的状态转换，注明模型可见资料、工具契约、回执、预算与停止；再用一个失败轨迹定位问题，不接入私人数据或写操作。
  title: 从工具边界，走向 Agent 开发
  summary: 理解谁控制下一步，区分本地/模型上下文，组织检索证据，并用任务与轨迹检验停止是否合理。
  prerequisite: 建议先理解请求和 JSON；已有工具路线可随时并行阅读，不设解锁或自动先修判断。
  steps:
    - id: agent-control-loop
      title: 谁决定下一步，什么时候停？
      focus: 画出模型提议、程序执行和观察的关系，给完成、失败与预算耗尽命名。
      note: agent-loop-basics
      lab: /playground/agent-runtime/
      lab_label: 逐步执行脚本循环与预算停止
      question: 固定脚本、模型路由和多步 Agent 的控制流有何不同？连续相同提议没有进展时，如何区分完成、失败和预算耗尽？轮数限制为什么不等于工具次数限制？
    - id: agent-context-evidence
      title: 找到了片段，回答就有依据吗？
      focus: 用版本和适用条件核对引用，把检索命中与回答忠于证据分开。
      note: retrieval-evidence
      lab: /playground/retrieval/
      lab_label: 检索虚构手册并选择完整证据
      question: 对照虚构手册v1/v2和试用/正式空间，解释为什么引用真的链接仍可能答错。写出一条主张到片段、版本和适用条件的完整证据链。
    - id: agent-permission-boundaries
      title: 工具结果中的指令，能改变权限吗？
      focus: 回到循环文章的上下文部分，画出本地对象、模型消息与保存状态的数据边界。
      note: agent-loop-basics
      lab: /playground/tool-calling/
      lab_label: 尝试未开放工具并核对回执
      question: 区分本地上下文、模型可见消息和持久运行状态。工具片段要求上传手记时，为什么不能执行？隐藏工具名与真正的资源权限检查有何区别？
    - id: agent-trace-evaluation
      title: 运行结束，和任务做对，差在哪里？
      focus: 从真实可操作的错误案例定位失效层，设计必要且不泄露私人资料的诊断记录。
      note: agent-evaluation
      lab: /playground/agent-runtime/
      lab_label: 核对事件、回执和未完成状态
      question: 从类型错误、执行失败、错配回执和解释越界中各选一例，写明期待状态和检查层。哪些轨迹字段值得保留，哪些私人内容不应默认上传？
- id: agent-building
  title: 把一个只读 Agent 搭起来
  summary: 从可下载的小项目开始，分清真实工具与假模型响应，核对独立预算、失败状态和任务验收。
  prerequisite: 建议先能读Python函数与JSON；不设解锁。离线部分需Python3.11+及固定SDK安装，不需要API Key。
  challenge: 解压并运行项目，保留一份公开离线结果，解释它通过哪层检查；为自己的任务写一个简单基线、拒绝例和未调过的保留题。
  steps:
    - id: agent-build-project
      title: 一个最小项目，需要哪些文件？
      focus: 对照真实下载包，把资料、运行时、假响应、依赖和检查程序分开。
      note: agent-project-starter
      question: 说明agent_loop.py、demo_offline.py、catalog.json与run_checks.py各负责什么。为什么安装SDK不等于拥有模型，静态网页也不会替你执行Python？
    - id: agent-build-adapter
      title: 哪一部分真实运行，哪一部分是假回包？
      focus: 核对真实SDK、内存MockTransport、确定工具与尚未发生的模型推理。
      note: agent-project-starter
      lab: /playground/tool-calling/
      lab_label: 免安装复习真实工具与脚本提议
      question: 默认离线项目为什么有两次SDK请求和一次实际工具派发，却没有模型推理？换成自己的客户端后，哪些资料会离开本地、哪些契约仍要保持？
    - id: agent-build-budgets
      title: 两个工具只允许执行一个，会留下什么？
      focus: 用批量情景对照Python输出和浏览器实验，区分部分工作与最终回答。
      note: agent-loop-basics
      lab: /playground/agent-runtime/
      lab_label: 对照批量派发上限1的停止状态
      question: 把批量情景派发上限设为1，列出实际请求/提议、派发和观察数。第二个工具为什么没有结果，为什么不能补成完成？请求/派发上限又为什么不是费用或全任务截止？
    - id: agent-build-acceptance
      title: 六项检查通过，证明了什么？
      focus: 从一项会失败的改动开始，分开程序契约、工具数值、任务结果与真实模型评测。
      note: agent-testing-contracts
      question: 选一项离线检查，写出输入、可观察断言与检查层，再给出一个全部契约通过但任务仍会答错的反例。换模型后哪些结论必须重新验证？
    - id: agent-mcp-discovery
      title: 一个协议工具服务，需要模型吗？
      focus: 运行本机MCP包，核对真实发现、三种角色与固定SDK的两种协议模式。
      note: agent-mcp-server
      question: 画出检查脚本、MCP客户端、stdio、服务和实际函数的位置。没有模型时为什么仍可调用工具？为什么只打印版本字符串或服务名称不足以证明发现、身份和任务正确？
    - id: agent-mcp-validation
      title: 协议接通后，哪些检查仍不能省？
      focus: 对照低层输入校验、错误标志、结构化输出和独立数值事实。
      note: agent-mcp-server
      lab: /playground/tool-calling/
      lab_label: 免安装对照参数与回执，非MCP协议页
      question: 解释SDKv2低层公布schema与真实参数校验的区别。形状正确但距离999的回执为何还能过schema？readOnlyHint、is_error和_meta分别不能保证什么？

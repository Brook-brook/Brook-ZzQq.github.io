schema_version: 1
ai_assisted: true
links:
  - id: protocol-host-bridge
    from: agent-mcp-server
    to: agent-mcp-bridge
    kind: extend
    reason: 把独立MCP服务接到真实SDK的宿主适配，沿调用信封、实际协议与对应回执理解中间职责，不把预写响应当推理。
  - id: bridge-runtime-boundaries
    from: agent-mcp-bridge
    to: agent-loop-basics
    kind: compare
    reason: 对照直接函数与协议调用的独立预算，区分客户端尝试、服务执行、已接收观察和没有发生的后续工作。
  - id: bridge-contract-evidence
    from: agent-mcp-bridge
    to: agent-testing-contracts
    kind: compare
    reason: 用坏回执、部分预算与取消检查程序契约，再给出协议成功但任务仍错的反例；确定性参考不是通用事实核查。
  - id: interface-real-protocol
    from: skills-mcp-boundaries
    to: agent-mcp-server
    kind: extend
    reason: 从四层概念走到真实本机发现与调用，区分普通JSON、SDK协商、注解和实际校验；不把协议连接当任务认证。
  - id: starter-mcp-service
    from: agent-project-starter
    to: agent-mcp-server
    kind: extend
    reason: 在直接函数项目之外，把同一公开只读工具通过stdio提供；服务不需要模型，原客户端不会自动升级为MCP适配器。
  - id: protocol-contract-checks
    from: agent-mcp-server
    to: agent-testing-contracts
    kind: compare
    reason: 对照协议回执、输出schema与任务验收；错误信号和正确形状都不能代替独立数值、来源及现实适用检查。
  - id: loop-starter
    from: agent-loop-basics
    to: agent-project-starter
    kind: extend
    reason: 把运行时分层与预算带到实际可解压项目，分清真实SDK、只读函数与脚本假响应；先离线再决定真实接入。
  - id: starter-contract-checks
    from: agent-project-starter
    to: agent-testing-contracts
    kind: extend
    reason: 运行后逐条阅读六项断言，用可观察状态验收，而不是只看最后出现文本；离线契约不等于模型评测。
  - id: contract-task-evaluation
    from: agent-testing-contracts
    to: agent-evaluation
    kind: compare
    reason: 对照程序契约与完整任务核查，保留简单基线、失败例和保留题；一次包内通过不能证明真实场景可靠。
  - id: tools-skill-protocol
    from: tool-calling-boundaries
    to: skills-mcp-boundaries
    kind: extend
    reason: 实际核对一次工具参数与回执后，再区分工具实现、工作指引与协议适配；文件名和连接成功都不能代替执行与授权。
  - id: loop-skill-protocol
    from: agent-loop-basics
    to: skills-mcp-boundaries
    kind: compare
    reason: 对照谁决定下一步、谁提供流程知识、谁交换能力与上下文；选择Skill或MCP不自动决定运行时，也不保证任务正确。
  - id: values-model-request
    from: python-first-steps
    to: model-request-contracts
    kind: prepare
    reason: 能读函数、值与异常后，再理解请求输入、状态和SDK错误；Python基础是便于阅读的建议，不是锁定先修。
  - id: foundations-request
    from: ai-app-foundations
    to: model-request-contracts
    kind: prepare
    reason: 先分清模型、应用与上下文，再给实际调用定义输入、超时和输出状态；不把一次完整文本当作事实核验。
  - id: request-tool-contract
    from: model-request-contracts
    to: tool-calling-boundaries
    kind: compare
    reason: 对照结构化输出与工具执行，分别检查格式、允许操作、真实回执和业务含义；schema不能代替权限或事实证据。
  - id: request-agent-loop
    from: model-request-contracts
    to: agent-loop-basics
    kind: extend
    reason: 从一次调用的错误与完成状态，走向多轮模型提议、工具执行和有预算的停止；轮数、工具数与总费用需要分开管理。
  - id: loop-retrieval
    from: agent-loop-basics
    to: retrieval-evidence
    kind: extend
    reason: 工具观察进入下一轮上下文后，还需核对版本、适用条件与不可信指令；资料被检索到不等于自动获得授权或成为事实。
  - id: retrieval-agent-evaluation
    from: retrieval-evidence
    to: agent-evaluation
    kind: prepare
    reason: 先把检索命中与回答忠于证据分开，再为整个Agent定义任务验收与失败轨迹；组件成绩不自动变成整体成功率。
  - id: loop-agent-evaluation
    from: agent-loop-basics
    to: agent-evaluation
    kind: extend
    reason: 运行时有了完成、失败和预算状态，仍需用独立用例判断任务是否做对；日志长度和done不是可靠性证明。
  - id: foundations-metrics
    from: ai-app-foundations
    to: ai-evaluation-basics
    kind: compare
    reason: 用已有合成分类实验复习指标分母，再为实际AI任务另选基线和验收；不把演示分数当作某个真实模型的性能。
  - id: games-public-goods
    from: game-equilibrium
    to: public-goods
    kind: extend
    reason: 从两人最佳回应走向多人共享返还，逐一检查谁能单方面多得；再用单独的收益总和目标比较，不把两人切片当成完整多人均衡。
  - id: values-records
    from: python-first-steps
    to: rss-normalization
    kind: prepare
    reason: 先分清值、类型和容器，再观察 RSS 字段怎样进入结构化记录；这不要求用 Python 运行 RSS 实验。
  - id: records-source
    from: rss-normalization
    to: bestblogs-research
    kind: extend
    reason: 去重实验展示一条记录怎样保留；源码研究进一步核对 CLI、数据流和证据，区分实际实现与产品描述。
  - id: values-contracts
    from: python-first-steps
    to: tool-calling-boundaries
    kind: prepare
    reason: 用值和类型的基础理解 JSON 参数契约；合法字符串、数值与允许操作是不同问题，不要求接入模型账号。
  - id: distance-validation
    from: mercator-scale
    to: spatial-validation
    kind: prepare
    reason: 先问坐标、单位和距离模型，再看空间邻居；投影尺度实验与合成平面点各有范围，不能混用成真实地理精度。
  - id: metrics-space
    from: ai-evaluation-basics
    to: spatial-validation
    kind: prepare
    reason: 先核对混淆矩阵和分母，再比较随机与整区测试；类别构成和预测区域不同，不能只比较一个准确率。
  - id: report-metrics
    from: reading-ai-evidence
    to: ai-evaluation-basics
    kind: extend
    reason: 把报告中的“高准确率”落到可操作算例，逐条找误报、漏报和没有定义的指标；合成实验不验证真实模型。
  - id: space-report
    from: spatial-validation
    to: reading-ai-evidence
    kind: compare
    reason: 对照本机留出实验与模型报告的任务、划分和基线；计算可复算不意味着外推可靠，报告仍需原文证据。
  - id: tools-space
    from: tool-calling-boundaries
    to: spatial-validation
    kind: compare
    reason: 工具回执一致性与模型评估有效性是两道边界。一次计算可以完全正确，但所用资料或预测目标仍不适合现实问题。
  - id: games-policy
    from: game-equilibrium
    to: reading-world-evidence
    kind: compare
    reason: 收益矩阵帮助明确模型假设；现实政策判断还需文本状态、执行资料和独立证据，不能从模型直接预测国家行为。
  - id: ai-world-evidence
    from: reading-ai-evidence
    to: reading-world-evidence
    kind: compare
    reason: 两种阅读都要保留版本、原文和证据边界；AI 任务预算与经济统计口径并非同一概念，需要分别核对。
  - id: metadata-evidence
    from: rss-normalization
    to: reading-ai-evidence
    kind: prepare
    reason: 条目规范化、标题收集或来源可访问都不等于主张已核对；沿原文继续检查任务、条件、基线与限制。
  - id: source-tools
    from: bestblogs-research
    to: tool-calling-boundaries
    kind: extend
    reason: 从核对源码中的请求与数据流，走向可操作的调用边界；结构化请求不自动授予权限，运行示意也不是实际 Agent。

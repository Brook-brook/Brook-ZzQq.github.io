python-values:
  hint: 先区分“没有样本”和均值为零，再看函数有没有检查空列表。
  explanation: 示例列表 [12, 18, 24] 的均值是 18.0。教程的 mean 在空列表时主动抛出 ValueError，明确说明输入前提；若删掉这层检查，sum([]) / len([]) 会因除零抛出 ZeroDivisionError。先核对正在运行的函数，再记录真实输出和异常。
  counterexample: 把空列表均值直接写成 0，会混淆“没有观测”和“观测均值恰好为零”。这是一个额外业务约定，不能静默当作普通均值。
  code: |
    def mean(values):
        if not values:
            raise ValueError("Need at least one value")
        return sum(values) / len(values)
rss-records:
  hint: 分别考察资源参数 id、跟踪参数 utm_source 和 #fragment，不要把所有 query 都删掉。
  explanation: 本实验保留 id 等资源参数；id=1 与 id=2 因而仍是不同规范 URL。开启去跟踪参数后，只有跟踪参数或片段不同的链接可能合并。规范 URL 相同只是本实验的链接身份判断，没有读取或比较正文。
  counterexample: 同标题可能是不同版本；不同 URL 也可能转载相同正文。仅靠标题或规范 URL，不能证明内容独立或权威。
source-evidence:
  hint: 找一条可定位到固定提交的代码证据，再写出一次尚未运行或生产实现不可见的问题。
  explanation: 研究笔记中的 A 级是源码/配置直接可见，例如 CLI 深读默认标记已读；D 级是当前无法验证，例如生产模型版本或完整费用。等级是该笔记的工作约定。source_checked 只表示来源交叉核对，不表示 Brook 人工批准了结论或复现了生产系统。
  counterexample: README 描述某种能力可以作为官方描述证据，却不能单凭这段话断言生产实现、效果和成本已经验证。
mercator-assumptions:
  hint: 把纬度 60° 代入 k = 1 / cos(φ)，再对长度尺度平方。
  explanation: 球面墨卡托在 60° 的局部长度尺度为 2，局部面积尺度为 4。它描述一点附近的微分尺度，不是整条任意长路线的统一修正系数；跨纬度时尺度也随位置变化。
  counterexample: 不能取路线某个端点的尺度，就把跨很大范围的地图长度除以它当作准确地面距离；还应核对 CRS、单位和测地模型。
map-provenance:
  hint: 先打开一个地点的来源，再分开看代表点、建筑范围、入口和道路网络。
  explanation: 当前地图提供六个有公开来源的 WGS84 代表点。点位可用于概览和资料回查，不能自动视为建筑入口；没有经过验证的道路拓扑、通行规则和距离模型，无法据此计算可靠步行最短路径。
  counterexample: 连接两个代表点的直线只表示点间关系，不会自动成为可通行的校园路线。收藏地点也不记录到访或个人定位。
copy-relations:
  hint: 分开画对象的指针成员和它所指向的动态资源，再追踪修改发生在哪一层。
  explanation: 默认复制裸指针成员时，复制的是地址，两个对象会指向同一资源。演示的深拷贝另外分配并复制整数，副本修改因此独立；它假设源指针有效，且只展示复制构造，不是完整生产级值类型。
  counterexample: std::shared_ptr 的复制共享所有权，不是深拷贝；std::unique_ptr 本身不能复制。std::vector 的值复制则由容器管理独立元素存储。
lifetime-boundaries:
  hint: “已经释放”与“必然出现某种输出”是不同的说法。
  explanation: 同一资源被两个拥有型裸指针重复 delete 会导致未定义行为，不能预测确定输出或保证崩溃。演示在风险点停止。std::vector 通过 RAII 管理资源并提供值语义，让有效对象的复制与生命周期遵守容器约定。
  counterexample: 一次运行恰好没有崩溃，不证明危险代码是正确的。浅拷贝也不是所有场景都错误，关键在于资源所有权与生命周期是否明确。
individual-collective:
  hint: 先固定对方策略比较自己的两种收益，再用两人的收益总和比较整体结果。
  explanation: 默认囚徒困境中，背叛对双方都是严格占优，双方背叛是唯一均衡，各得 1；双方合作各得 3，总和更高。默认猎鹿结构有双方猎鹿和双方猎兔两个纯策略均衡，体现协调问题。改变参数后要重新检查最佳回应与博弈条件。
  counterexample: 均衡不等于收益总和最大，也不自动等于公平。把参数改到不满足 T > R > P > S 后，不能仍称它为标准囚徒困境。
pure-equilibrium:
  hint: 对每个单元格都检查两位玩家能否单方面提高收益，再区分纯策略与混合策略。
  explanation: 在匹配硬币中，每个纯策略结果都有人愿意改变，因此探索器找不到纯策略均衡。但标准对称匹配硬币存在双方各以 1/2 概率选两种策略的混合均衡；当前工具只枚举纯策略。
  counterexample: “没有星号”只说明本工具在该矩阵没有找到纯策略均衡，不意味着有限博弈不存在允许混合策略的纳什均衡。
classification-denominators:
  hint: 先数真实正例，再写出召回率 TP / (TP + FN) 的分母。
  explanation: 稀有正例场景阈值 100 时，TP=0、FN=2、TN=18，准确率 90%，召回率 0/2=0。没有正例的场景此时 TP=FN=0，召回率分母为零而未定义；本实验以“—”表示，不能当作零或完美召回。
  counterexample: 全部预测为 0 可以有很高准确率，却未识别任何正例。无预测正例时，精确率也未定义。
spatial-holdout:
  hint: 保持 k=3、种子 42、留出 A，切换标签结构，先数两组测试正例。
  explanation: 对角线标签下，默认随机组准确率 90%，整区 A 为 100%，所以整区留出不一定更差。但 A 区测试点全为 0，召回率未定义。选 S01 可看到它只用训练点 S05、S41、S42 投票；邻居距离与类别构成应和预测目标一起检查。
  counterexample: 不能把两种测试集的分数差全归因于空间泄漏，或把一次留出称为完整交叉验证。空间分组应反映部署目标，而非一律追求低分。
evaluation-evidence:
  hint: 给每个判断附上原文位置；找不到的条件明确写成未知。
  explanation: 一张可核对的报告卡包括具体任务与版本、部署分布、数据划分、合理基线、指标分母、工具/推理预算、波动与限制。没有空间外推测试时，不能仅凭区域内成绩声称可可靠迁移到所有新区域；也不能反向断言它一定不能迁移。
  counterexample: 排行榜领先是特定条件下的比较；作者自报、独立复现和自己的迁移推断属于不同证据，不会因为数字相同而自动等价。
ai-version-scope:
  hint: 先写版本、日期和原文位置，再问“谁在什么条件下验证了什么”。
  explanation: 论文预印本、模型发布、产品演示和独立评测应分开记录。固定版本后，核对任务、数据、基线、工具与预算，再看限制。公开订阅流中的标题仍是 needs_review 元信息，不能当作已经核对的事实或结论。
  counterexample: 同一演示被多个平台转发，并不会自动变成多份独立验证；预印本发布也不自动等于通过同行评审。
economy-denominators:
  hint: 给数字补上统计期、单位、比较基准、价格口径与修订状态。
  explanation: 同比与环比的分母不同；名义与实际需要考虑价格口径；总量与人均回答不同问题。先区分实绩、估计与预测，再核对发布日期和数据截止日。资料缺失应保留未知，不用零填补。
  counterexample: 自编例子：本季指数 110、上季 100，只能直接算出环比增长 10%；没有去年同季值，就不能据此声称同比增长 10%。这不是现实统计数据。
policy-status:
  hint: 把发言、草案、通过文本、生效、适用与执行结果拆开，附文号/条款和日期。
  explanation: 政策阅读先定位具体文本、版本、主体、适用对象与状态，再区分机构立场、报道和自己的解释。多家报道可能转引同一材料，应追踪证据来源，而非按域名数认定独立。政策之后出现结果，也不能只凭先后顺序确认因果。
  counterexample: 自编情景：“草案提出明年适用”不能写成“现已实施并取得成效”。正式文本、分阶段适用与实际执行仍需各自证据；此处不描述任何现实政策。
tool-contract:
  hint: 先检查 JSON 语法，再检查字段、类型和白名单；最后把调用和原问题对照。
  explanation: JSON 解析只产生数据。应用还需验证工具是否开放、字段与类型是否符合契约、地点是否存在、操作是否有授权，并检查是否回答原问题。把字符串 "200" 改成数值 200 只修复类型；把两点设成相同地点可合法得到 0 米，却可能偏离原意。本实验只执行白名单内三个本机只读函数。
  counterexample: 一个合法 JSON 可以请求不存在的 publish_notes。工具描述写着“只读”也不能替代实际访问控制。这里没有读取手记或发布网站的权限和函数。
tool-observation:
  hint: 区分“结果形状像什么”和“哪次调用产生了这份结果”；再检查资料日期。
  explanation: 回执必须匹配当前调用 ID、工具名和参数状态。本页三个小型确定工具可重算比对，改参数后旧校验与结果都会清除。匹配和重算只说明本页计算的一致性，不证明公开目录最新、现实描述完整或模板解释覆盖了所有限制。
  counterexample: 另一调用也可能返回一个看起来合理的距离；直接接入会答错问题。即使回执正确，把球面距离解释成步行路线仍然越过了计算与资料边界。
tool-boundaries:
  hint: 先数这份目录包含什么，再问采用了哪种距离模型、缺少什么道路资料。
  explanation: 半径 0 排除中心点，只搜索已有六点；没有食堂点位不意味着校园没有食堂。距离采用平均半径的球面短弧，坐标采用 WGS84 并不会让算法自动变成椭球测地线；代表点也不是建筑入口。步行导航还需道路连通、通行条件与入口等有来源资料。
  counterexample: 算式准确和数据新鲜是不同判断。一个很近的代表点可能隔水或不可达，不能仅凭距离给出路线、时长或开放承诺。
public-goods-incentives:
  hint: 两次比较固定的条件不同。先写公共份额，再加上玩家1保留的点数。
  explanation: 默认 n=4、m=1.6、每人投10，份额16，玩家1得26。只让玩家1投0时，其他人仍各投10，份额12，玩家1得32；所有人都投0时公共份额为0，每人只得起始20。纳什检验固定别人，逐个问能否严格多得；群体目标另用总和 nw+(m-1)Σc 比较，默认全投20总和128高于全投0的80。
  counterexample: 每个人单独偏离都有好处，不意味着所有人一起偏离仍有同样好处。总收益最大也不是公平的定义，更不能直接预测真实参与者或政策结果。
public-goods-boundaries:
  hint: 分开检查 m/n−1 和 m−1；两条式子的零点不同。
  explanation: m=1 时总收益恒为 n×20，但 n≥2 使个人边际1/n−1为负，个人仍严格偏好0。m=n 时个人边际为0，所有允许动作都最佳回应、所有纯策略组合都均衡；此时m>1，总和仍在全额贡献时最大。两人切片只改变玩家1/2，其他人固定，完整均衡仍需检查每个玩家。
  counterexample: 四人、倍率1时，一人投20会使该人得5、其他人各25，总和仍80；总和相同不等于分配相同。倍率等于人数时存在非总和最优的均衡，不能把所有均衡视为集体最优。

      text: 不是道路底图或步行导航。食堂、宿舍区尚未收录核实坐标；分类保留明确空状态。
    - label: 开发记录
      text: 第四轮完成 Obsidian Glass 地图工作区、移动端与交互复审，开发分支待审核，未自动部署。

- id: universe
  title: Brook’s Digital Universe
  type: Web / Personal space
  status: available
  status_label: 已实现
  summary: 让学习笔记、技术作品与新的探索方向，在同一个个人数字空间里持续生长。
  stack: [Jekyll, Markdown, YAML, JavaScript]
  details:
    - label: 内容结构
      text: Study 读取 Markdown 教程，Projects 读取独立项目记录；保留原 Brook’s Atlas 的学习实验与知识地图。
    - label: 实现取舍
      text: 复用静态站点与本地交互，避免为内容管理引入数据库或大型框架。
  links:
    - label: 查看源码
      url: https://github.com/Brook-brook/Brook-ZzQq.github.io
    - label: 浏览 Study
      url: /study/
- id: learning-lab
  title: Learning Lab
  type: Interactive learning
  status: available
  status_label: 已实现
  summary: 在收益矩阵、对象复制、地图尺度与 Python 代码之间，把一个问题变成可以验证的实验。
  stack: [JavaScript, SVG, Pyodide, Web Worker]
  details:
    - label: 现在能做什么
      text: 囚徒困境与猎鹿、通用 2×2 纯策略均衡探索器、C++ 对象复制、墨卡托局部尺度与 Python 执行；开发分支另增阈值评测、空间留出对照、本地 GIS 工具调用、受控循环与停止、检索证据实验、公共物品模型、AI/Agent 基础路径与共享手记的自解释练习，待审查发布。
    - label: 模型边界
      text: 不计算混合策略均衡；C++ 是语义可视化；空间留出使用合成平面点；GIS 工具实际执行本地只读计算，提案与解释仍是脚本；公共物品是单轮点数模型，不预测现实合作。Python 按需在 Worker 加载，支持停止与错误反馈。
  links:
    - label: 打开实验室
      url: /playground/
    - label: 运行 Python
      url: /playground/python/
- id: zijingang
  title: Zijingang Point Atlas
  type: GIS / Campus exploration
  status: review

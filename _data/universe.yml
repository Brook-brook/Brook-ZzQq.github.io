preview_notes:
  - slug: python-first-steps
    sample: |
      def greet(name):
          return f"Hello, {name}!"

      ideas = ["learn", "build", "explore"]
      for idea in ideas:
          print(greet(idea))
  - slug: cpp-copy
    sample: |
      // 独立资源，明确所有权
      std::vector<int> original{1, 2, 3};
      auto copy = original;
      copy[0] = 42;
      // original[0] 仍为 1
  - slug: mercator-scale
    sample: |
      # 球面墨卡托的局部尺度
      import math
      latitude = 60
      k = 1 / math.cos(math.radians(latitude))
      print(round(k, 1))  # 2.0
  - slug: game-equilibrium
    sample: |
      合作 / 合作：3, 3
      背叛 / 合作：5, 0
      合作 / 背叛：0, 5
      背叛 / 背叛：1, 1

      均衡不等于社会最优。

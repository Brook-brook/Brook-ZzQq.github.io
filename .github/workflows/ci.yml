name: CI

on:
  push:
    branches:
      - master
      - "hotfix/*"
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/ci.yml"
      - .gitignore
      - "docs/**"
      - README.md
      - LICENSE
  pull_request:
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/ci.yml"
      - .gitignore
      - "docs/**"
      - README.md
      - LICENSE

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        ruby: ["3.3", "3.4"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # for posts's lastmod

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Build Assets
        run: npm ci && npm run build

      - name: Test Atlas models
        run: npm run test:atlas

      - name: Test Site
        run: bash tools/test.sh

      - name: Install browser
        if: matrix.ruby == '3.3'
        run: npx playwright install --with-deps chromium

      - name: Test Atlas in browser
        if: matrix.ruby == '3.3'
        run: |
          python3 -m http.server 4173 --directory _site &
          for attempt in {1..20}; do
            curl --silent --fail http://127.0.0.1:4173/Brook-ZzQq.github.io/ >/dev/null && break
            sleep 0.5
          done
          npm run test:atlas:browser

      - name: Test real browser Python
        if: matrix.ruby == '3.3'
        run: |
          python3 -m http.server 4174 --directory _site &
          for attempt in {1..20}; do
            curl --silent --fail http://127.0.0.1:4174/Brook-ZzQq.github.io/ >/dev/null && break
            sleep 0.5
          done
          ATLAS_BASE_URL=http://127.0.0.1:4174/Brook-ZzQq.github.io npm run test:atlas:python

      - name: Upload review preview
        if: matrix.ruby == '3.3'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-review-preview
          path: _site
          retention-days: 7
